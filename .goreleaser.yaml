version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip

brews:
  - repository:
      owner: sunmingdh
      name: homebrew-lazysm2
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/sunmingdh/lazysm2"
    description: "A terminal UI for hmrc/sm2"
    license: "Apache-2.0"
    caveats: |
      lazysm2 requires sm2 to be installed and on your PATH.
    install: |
      bin.install "lazysm2"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
